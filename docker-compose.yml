version: '3.8'

services:
  w9-db:
    image: ghcr.io/${GITHUB_USER:-w9labs}/w9-db:latest
    container_name: w9-db
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.w9-db.rule=Host(`db.w9.nu`)"
      - "traefik.http.routers.w9-db.entrypoints=websecure"
      - "traefik.http.routers.w9-db.tls=true"
      - "traefik.http.services.w9-db.loadbalancer.server.port=8082"
    ports:
      - "${W9_DB_PORT:-8082}:8082"
    environment:
      - HOST=0.0.0.0
      - PORT=8082
      - DATABASE_URL=${DATABASE_URL:-memory}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - ISSUER_URL=${ISSUER_URL:-https://db.w9.nu}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@w9.nu}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-W9AdminSecure123!}
    volumes:
      - w9-db-data:/app/data
    networks:
      - w9-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Watchtower for auto-updates
  watchtower:
    image: containrrr/watchtower:latest
    container_name: w9-db-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_LABEL_ENABLE=true
    command: --interval 300 --scope w9-db
    networks:
      - w9-network

volumes:
  w9-db-data:
    driver: local

networks:
  w9-network:
    external: true
